[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Metal Gear Remaster Prototype
Description=Third-person free-camera stealth vertical slice, not a finished remaster

[/Script/UnrealEd.ProjectPackagingSettings]
; Gameplay uses LoadObject at runtime rather than hard UPROPERTY references for
; imported character meshes and their source clips. Without explicit cook
; roots, a Development package can compile but show invisible/T-pose actors.
; Cook all original imported cast assets, including supporting characters.
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
; The player and bosses also dynamically load replacement source weapons.
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Feedback")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Transceiver")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Shotmaker")
; These folders only contain source-imported .uassets after Editor import.
; The repository currently has none; cooking cannot fabricate them.

+DirectoriesToAlwaysCook=(Path="/Game/Audio/VO")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Snake/Hair")
; Optional imported and legally cleared assets only; folders may still be empty.

+DirectoriesToAlwaysCook=(Path="/Game/Characters/Animals")
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Animals")
; Real canine rig, AnimBP and bark recordings remain absent until Editor import.
